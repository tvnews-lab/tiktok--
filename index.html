/* =========================
   APIキー管理
========================= */

const API_KEY_STORAGE = "kbc_tiktok_youtube_api_key"

function loadApiKey(){
  const key = localStorage.getItem(API_KEY_STORAGE)
  const input = document.getElementById("apiKeyInput")
  const badge = document.getElementById("savedBadge")
  if(key){
    input.value = key
    badge.style.display = "inline"
  }
}

function saveApiKey(){
  const key = document.getElementById("apiKeyInput").value.trim()
  if(!key){
    alert("APIキーを入力してください")
    return
  }
  localStorage.setItem(API_KEY_STORAGE, key)
  document.getElementById("savedBadge").style.display = "inline"
  alert("APIキーを保存しました。次回以降は自動で使用されます。")
}

function deleteApiKey(){
  localStorage.removeItem(API_KEY_STORAGE)
  document.getElementById("apiKeyInput").value = ""
  document.getElementById("savedBadge").style.display = "none"
  alert("APIキーを削除しました。")
}

function getApiKey(){
  // まずlocalStorageから取得、なければ入力欄から取得
  let key = localStorage.getItem(API_KEY_STORAGE)
  if(!key){
    key = document.getElementById("apiKeyInput").value.trim()
  }
  if(!key){
    key = prompt("YouTube API Key を入力してください")
    if(key){
      // 入力されたら保存するか確認
      if(confirm("このAPIキーを保存しますか？（次回以降入力不要になります）")){
        localStorage.setItem(API_KEY_STORAGE, key)
        document.getElementById("apiKeyInput").value = key
        document.getElementById("savedBadge").style.display = "inline"
      }
    }
  }
  return key
}

/* =========================
   タグ生成
========================= */

function generateHashtags(title,desc){

const text=title+" "+desc
const tags=[]

function addTag(name){
if(!tags.includes(name)&&tags.length<3){
tags.push(name)
}
}

/* JR駅 */

JR_STATIONS.forEach(s=>{
if(text.includes(s)) addTag(s)
})

/* 地下鉄駅 */

SUBWAY_STATIONS.forEach(s=>{
if(text.includes(s)) addTag(s)
})

/* 西鉄駅 */

NISHITETSU_STATIONS.forEach(s=>{
if(text.includes(s)) addTag(s)
})

/* エリア */

AREAS.forEach(a=>{
if(text.includes(a)) addTag(a)
})

/* 区 */

WARDS.forEach(w=>{
if(text.includes(w)) addTag(w)
})

/* 市 */

CITIES.forEach(c=>{
if(text.includes(c)) addTag(c)
})

/* 県 */

REGIONS.forEach(r=>{
if(text.includes(r)) addTag(r)
})

/* カテゴリ */

CATEGORIES.forEach(cat=>{
cat.kw.forEach(k=>{
if(text.includes(k)) addTag(cat.tag)
})
})

return tags.slice(0,3)

}

/* =========================
   YouTube取得
========================= */

async function fetchVideos(){

const API_KEY = getApiKey()

if(!API_KEY){
  alert("APIキーが必要です。入力欄にAPIキーを入力して「保存」を押してください。")
  return
}

const res=await fetch(
`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet&order=date&maxResults=10`
)

const data=await res.json()

if(data.error){
  alert("APIエラー: " + data.error.message)
  return
}

const container=document.getElementById("videoList")
container.innerHTML=""

data.items.forEach(v=>{

if(!v.snippet) return

const title=v.snippet.title
const desc=v.snippet.description

const autoTags=generateHashtags(title,desc)

const tagText=[
...FIXED_TAGS,
...autoTags
].map(t=>"#"+t).join(" ")

const text=`${title}◆${desc.split("。")[0]}。 ${tagText}`

const div=document.createElement("div")
div.className="video-card"

div.innerHTML=`

<img class="thumb" src="${v.snippet.thumbnails.medium.url}">

<h3>${title}</h3>

<div class="tags">
${tagText}
</div>

<div class="output">
${text}
</div>

<button onclick="navigator.clipboard.writeText(\`${text.replace(/`/g,'\\`')}\`)">
コピー
</button>

`

container.appendChild(div)

})

}
